
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:1.25rem;">
  <div style="background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:.85rem;">
    <p style="font-size:12px;color:var(--color-text-secondary);margin:0 0 3px;">Zostatok dnes</p>
    <p style="font-size:18px;font-weight:500;margin:0;" id="c-principal">—</p>
  </div>
  <div style="background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:.85rem;">
    <p style="font-size:12px;color:var(--color-text-secondary);margin:0 0 3px;">Celkové úroky</p>
    <p style="font-size:18px;font-weight:500;margin:0;" id="c-interest">—</p>
  </div>
  <div style="background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:.85rem;">
    <p style="font-size:12px;color:var(--color-text-secondary);margin:0 0 3px;">Splatnosť</p>
    <p style="font-size:18px;font-weight:500;margin:0;" id="c-years">—</p>
  </div>
  <div style="background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:.85rem;">
    <p style="font-size:12px;color:var(--color-text-secondary);margin:0 0 3px;">Splátok spolu</p>
    <p style="font-size:18px;font-weight:500;margin:0;" id="c-total">—</p>
  </div>
</div>

<div style="position:relative;width:100%;height:280px;margin-bottom:1.25rem;">
  <canvas id="mc"></canvas>
</div>

<!-- Periods editor -->
<div style="background:var(--color-background-secondary);border-radius:var(--border-radius-lg);padding:1rem 1.25rem;margin-bottom:1rem;">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem;">
    <p style="font-size:13px;font-weight:500;margin:0;">Fixačné obdobia</p>
    <button id="btn-add" style="font-size:12px;padding:4px 10px;border-radius:6px;border:1px solid var(--color-border-primary);background:var(--color-background-primary);color:var(--color-text-primary);cursor:pointer;">+ Pridať obdobie</button>
  </div>
  <div id="periods-list" style="display:flex;flex-direction:column;gap:8px;"></div>
  <p style="font-size:11px;color:var(--color-text-secondary);margin:10px 0 0;">Posledné obdobie = hypotetická sadzba do konca splatnosti (vypočíta sa automaticky)</p>
</div>

<!-- Base settings -->
<div style="background:var(--color-background-secondary);border-radius:var(--border-radius-lg);padding:1rem 1.25rem;">
  <p style="font-size:13px;font-weight:500;margin:0 0 10px;">Základné nastavenia</p>
  <div style="display:flex;flex-wrap:wrap;gap:12px 24px;font-size:13px;">
    <label style="display:flex;align-items:center;gap:8px;">Výška úveru:
      <input type="range" id="amt" min="500000" max="5000000" step="50000" value="1500000" style="width:110px;">
      <span id="amt-o" style="font-weight:500;min-width:75px;">1 500 000</span>
    </label>
    <label style="display:flex;align-items:center;gap:8px;">Splatnosť (roky):
      <input type="range" id="yrs" min="5" max="30" step="1" value="30" style="width:90px;">
      <span id="yrs-o" style="font-weight:500;min-width:25px;">30r</span>
    </label>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
function fmt(n){return Math.round(n).toLocaleString('sk-SK');}
function pmt(bal,r,n){if(r===0||n===0)return n?bal/n:0;return bal*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);}

const PERIOD_COLORS=['#185FA5','#A32D2D','#3B6D11','#7B3FA5','#BA7517','#1A7B7B'];

// Default periods: 3 fixations
let periods=[
  {rate:3,years:5},
  {rate:5,years:6},
  {rate:3.5,years:null} // null = remainder
];

let chart;

function renderPeriodList(){
  const el=document.getElementById('periods-list');
  el.innerHTML='';
  periods.forEach((p,i)=>{
    const isLast=i===periods.length-1;
    const color=PERIOD_COLORS[i%PERIOD_COLORS.length];
    const row=document.createElement('div');
    row.style.cssText='display:flex;align-items:center;gap:10px;font-size:13px;';
    row.innerHTML=`
      <span style="width:10px;height:10px;border-radius:50%;background:${color};flex-shrink:0;"></span>
      <span style="min-width:60px;color:var(--color-text-secondary);">${isLast?'Zvyšok':'Obdobie '+(i+1)}</span>
      <label style="display:flex;align-items:center;gap:6px;">
        Sadzba: <input type="number" step="0.1" min="0.1" max="20" value="${p.rate}" data-idx="${i}" data-field="rate"
          style="width:60px;padding:3px 6px;border-radius:6px;border:1px solid var(--color-border-primary);background:var(--color-background-primary);color:var(--color-text-primary);font-size:13px;"> %
      </label>
      ${!isLast?`<label style="display:flex;align-items:center;gap:6px;">
        Trvanie: <input type="number" step="1" min="1" max="29" value="${p.years}" data-idx="${i}" data-field="years"
          style="width:52px;padding:3px 6px;border-radius:6px;border:1px solid var(--color-border-primary);background:var(--color-background-primary);color:var(--color-text-primary);font-size:13px;"> r
      </label>`:'<span style="color:var(--color-text-secondary);font-size:12px;">(zostatok splatnosti)</span>'}
      ${periods.length>1&&!isLast?`<button data-del="${i}" style="margin-left:auto;font-size:11px;padding:2px 8px;border-radius:5px;border:1px solid var(--color-border-primary);background:var(--color-background-primary);color:#A32D2D;cursor:pointer;">✕</button>`:''}
    `;
    el.appendChild(row);
  });

  el.querySelectorAll('input[data-field]').forEach(inp=>{
    inp.addEventListener('input',e=>{
      const idx=+e.target.dataset.idx;
      const field=e.target.dataset.field;
      periods[idx][field]=+e.target.value;
      draw();
    });
  });
  el.querySelectorAll('button[data-del]').forEach(btn=>{
    btn.addEventListener('click',e=>{
      periods.splice(+e.target.dataset.del,1);
      renderPeriodList();draw();
    });
  });
}

function draw(){
  const principal=+document.getElementById('amt').value;
  const totalYears=+document.getElementById('yrs').value;
  document.getElementById('amt-o').textContent=fmt(principal);
  document.getElementById('yrs-o').textContent=totalYears+'r';

  // Build year→period map
  // Sum up defined years; last period fills remainder
  let usedYears=0;
  for(let i=0;i<periods.length-1;i++) usedYears+=(periods[i].years||0);
  const lastYears=Math.max(1,totalYears-usedYears);
  const resolvedPeriods=periods.map((p,i)=>({
    rate:p.rate/100/12,
    years:i===periods.length-1?lastYears:p.years,
    color:PERIOD_COLORS[i%PERIOD_COLORS.length],
    label:i===periods.length-1?`${p.rate}% (zvyšok)`:`${p.rate}% (${p.years}r)`
  }));

  // Simulate month by month
  const labels=[];
  const balances=[];
  // One interest dataset per period (sparse — nulls outside period)
  const interestDatasets=resolvedPeriods.map(()=>new Array(totalYears).fill(null));
  const principalArr=new Array(totalYears).fill(0);

  let bal=principal;
  let globalMonth=0;
  let totalInterest=0;
  let totalPaid=0;

  resolvedPeriods.forEach((period,pi)=>{
    const periodMonths=period.years*12;
    const remainingMonths=totalYears*12-globalMonth;
    const p=pmt(bal,period.rate,remainingMonths);

    for(let m=0;m<periodMonths&&globalMonth<totalYears*12;m++,globalMonth++){
      const yr=Math.floor(globalMonth/12);
      const ip=bal*period.rate;
      const pp=p-ip;
      totalInterest+=ip;
      totalPaid+=p;
      if(interestDatasets[pi][yr]===null) interestDatasets[pi][yr]=0;
      interestDatasets[pi][yr]+=ip;
      principalArr[yr]+=pp;
      bal=Math.max(0,bal-pp);
      if(globalMonth%12===11||globalMonth===totalYears*12-1){
        labels.push('R'+(yr+1));
        balances.push(Math.round(bal));
      }
    }
  });

  document.getElementById('c-principal').textContent=fmt(principal)+' CZK';
  document.getElementById('c-interest').textContent=fmt(totalInterest)+' CZK';
  document.getElementById('c-years').textContent=totalYears+' rokov';
  document.getElementById('c-total').textContent=fmt(totalPaid)+' CZK';

  // Build period boundary annotations
  const annotations={};
  let cumYears=0;
  resolvedPeriods.slice(0,-1).forEach((p,i)=>{
    cumYears+=p.years;
    annotations['refix'+i]={
      type:'line',
      xMin:cumYears-0.5,xMax:cumYears-0.5,
      borderColor:resolvedPeriods[i+1].color,
      borderWidth:2,borderDash:[5,3],
      label:{
        content:`Refix ${2024+cumYears}: ${(periods[i+1].rate)}%`,
        display:true,position:'start',
        backgroundColor:'rgba(0,0,0,0.06)',
        color:'var(--color-text-primary)',
        font:{size:10}
      }
    };
  });

  const cfg={
    type:'bar',
    data:{
      labels,
      datasets:[
        {label:'Zostatok istiny',data:balances,type:'line',borderColor:'#185FA5',
          backgroundColor:'rgba(24,95,165,0.07)',fill:true,tension:0.3,pointRadius:0,yAxisID:'y',order:0},
        {label:'Istina / rok',data:principalArr.map(Math.round),
          backgroundColor:'rgba(59,109,17,0.65)',borderRadius:2,yAxisID:'y2',order:1},
        ...interestDatasets.map((data,i)=>({
          label:`Úrok ${periods[i].rate}%`,
          data:data.map(v=>v===null?null:Math.round(v)),
          backgroundColor:resolvedPeriods[i].color+'AA',
          borderColor:resolvedPeriods[i].color,
          borderWidth:1,
          borderRadius:2,
          yAxisID:'y2',order:1
        }))
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{label:ctx=>{
          if(ctx.parsed.y===null)return null;
          return ctx.dataset.label+': '+fmt(ctx.parsed.y)+' CZK';
        }}},
        annotation:{annotations}
      },
      scales:{
        x:{ticks:{autoSkip:true,maxTicksLimit:12,color:'#888780'},grid:{display:false}},
        y:{position:'left',title:{display:true,text:'Zostatok (CZK)',color:'#185FA5',font:{size:11}},
          ticks:{color:'#185FA5',callback:v=>fmt(v)},grid:{color:'rgba(136,135,128,0.15)'}},
        y2:{position:'right',title:{display:true,text:'Ročné sumy (CZK)',font:{size:11}},
          ticks:{callback:v=>fmt(v)},grid:{display:false}}
      }
    }
  };

  if(chart)chart.destroy();
  chart=new Chart(document.getElementById('mc'),cfg);
}

document.getElementById('btn-add').addEventListener('click',()=>{
  // Insert new period before last
  const last=periods.pop();
  periods.push({rate:4,years:5});
  periods.push(last);
  renderPeriodList();draw();
});

['amt','yrs'].forEach(id=>document.getElementById(id).addEventListener('input',draw));

renderPeriodList();
draw();
</script>
